<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LVLS Agency — Carousel Preview</title>
<style>
:root{color-scheme:dark;--orange:#ff4d00}
*{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:#f2f2f0;font-family:ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:26px 28px 6px;max-width:1500px;margin:0 auto}
h1{font-size:20px;margin:0;letter-spacing:.02em}
h1 b{color:var(--orange)}
.sub{color:#8a8a88;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
main{max-width:1500px;margin:0 auto;padding:10px 28px 0;display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:34px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.stage{position:sticky;top:16px;align-self:start}
.frame{position:relative;background:#111;border:1px solid #262626;border-radius:14px;overflow:hidden}
.frame img{display:block;width:100%;height:auto;max-height:76vh;object-fit:contain;background:#0d0d0d}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
border:1px solid #333;background:rgba(10,10,10,.72);color:#fff;font-size:20px;cursor:pointer;
display:flex;align-items:center;justify-content:center;user-select:none}
.nav:hover{background:var(--orange);border-color:var(--orange);color:#0a0a0a}
.nav.prev{left:12px}.nav.next{right:12px}
.count{position:absolute;top:12px;right:14px;background:rgba(10,10,10,.72);border:1px solid #333;
border-radius:999px;padding:4px 12px;font-size:12px;letter-spacing:.18em;color:#c9c9c6}
.bar{display:flex;align-items:center;gap:10px;margin:12px 2px;flex-wrap:wrap}
.dots{display:flex;gap:7px;flex:1;min-width:140px}
.dot{height:7px;flex:1;border-radius:99px;background:#2c2c2c;cursor:pointer}
.dot.on{background:var(--orange)}
.btn{border:1px solid #333;background:#141414;color:#e8e8e5;border-radius:9px;padding:9px 14px;
font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--orange);color:var(--orange)}
.btn.solid{background:var(--orange);border-color:var(--orange);color:#0a0a0a;font-weight:700}
.btn.solid:hover{filter:brightness(1.1);color:#0a0a0a}
.side h2{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#8a8a88;margin:22px 0 10px}
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.rail button{padding:0;border:1px solid #242424;border-radius:9px;overflow:hidden;background:none;cursor:pointer}
.rail button.on{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.rail img{display:block;width:100%;height:auto}
.cap{background:#121212;border:1px solid #242424;border-radius:12px;padding:16px 18px;
white-space:pre-wrap;font-size:13px;line-height:1.7;color:#d6d3ce}
footer{max-width:1500px;margin:0 auto;padding:26px 28px 60px;color:#6d6d6b;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
</style></head><body>
<header><h1>LVLS AGENCY — <b>5 EMAIL FLOWS</b> carousel preview</h1>
<span class="sub">THU 15 OCT · 8:00 AM ET · 7 slides · save + DM AUDIT</span></header>
<main>
  <div class="stage">
    <div class="frame">
      <img id="shot" alt="carousel slide">
      <div class="count" id="count">01 / 07</div>
      <button class="nav prev" id="prev" aria-label="previous slide">&#8249;</button>
      <button class="nav next" id="next" aria-label="next slide">&#8250;</button>
    </div>
    <div class="bar">
      <div class="dots" id="dots"></div>
      <a class="btn" id="dl" download>download slide</a>
    </div>
    <div class="bar"><span class="sub" id="decknote"></span></div>
  </div>
  <div class="side">
    <h2>Decks</h2>
    <div class="bar" id="deckbar" style="margin:0 0 14px"></div>
    <h2>Slides in this deck</h2>
    <div class="rail" id="rail"></div>
    <h2>Caption (copy-paste)</h2>
    <div class="cap">__CAPTION__</div>
  </div>
</main>
<footer>LVLS Agency · email flows for fashion brands · rendered from code</footer>
<script>
const DECKS = __DECKS__;
let di = 0, si = 0;
const $ = id => document.getElementById(id);
function deck(){ return DECKS[di]; }
function show(){
  const f = deck().files[si];
  $('shot').src = f;
  $('count').textContent = String(si+1).padStart(2,'0') + ' / ' + String(deck().files.length).padStart(2,'0');
  $('dl').href = f; $('dl').setAttribute('download', f.split('/').pop());
  $('decknote').textContent = deck().label + ' · ' + deck().size + ' · ' + deck().note;
  [...$('dots').children].forEach((d,i)=>d.classList.toggle('on', i===si));
  [...$('rail').children].forEach((b,i)=>b.classList.toggle('on', i===si));
}
function setDeck(i){
  di = i; si = 0;
  $('deckbar').innerHTML = '';
  DECKS.forEach((d,k)=>{
    const b = document.createElement('button');
    b.className = 'btn' + (k===di?' solid':'');
    b.textContent = d.label;
    b.onclick = ()=>{ setDeck(k); };
    $('deckbar').appendChild(b);
  });
  $('dots').innerHTML = ''; $('rail').innerHTML = '';
  deck().files.forEach((f,i)=>{
    const d = document.createElement('div'); d.className='dot'; d.onclick=()=>{si=i;show();};
    $('dots').appendChild(d);
    const b = document.createElement('button'); b.onclick=()=>{si=i;show();};
    const im = document.createElement('img'); im.src=f; im.loading='lazy';
    b.appendChild(im); $('rail').appendChild(b);
  });
  show();
}
$('prev').onclick = ()=>{ si=(si-1+deck().files.length)%deck().files.length; show(); };
$('next').onclick = ()=>{ si=(si+1)%deck().files.length; show(); };
addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') $('next').click();
  if(e.key==='ArrowLeft') $('prev').click();
});
setDeck(0);
</script>
</body></html>
